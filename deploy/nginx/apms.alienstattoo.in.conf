# LIVE — apms.alienstattoo.in -> PM2 apms-rewrite on 127.0.0.1:3003
# From docs/perf/NGINX-AND-SERVER.md, with the real live port (3003, not 3000).
#
# CloudPanel: Sites -> apms.alienstattoo.in -> Vhost. Keep CloudPanel's own
# `listen` / `ssl_certificate` / `server_name` lines; add or replace ONLY the
# parts below, then Save (CloudPanel tests and reloads nginx).

# (1) at the very top of the vhost, OUTSIDE the server { } block.
#     Upstream names are global in nginx: live and staging must differ.
upstream apms_live {
    server 127.0.0.1:3003;
    keepalive 64;
    keepalive_timeout 4s;   # below Node's 5 s keep-alive
}

# (2) inside the `server { … listen 443 … }` block:
#     make sure the 443 listen line has http2, e.g.  listen 443 ssl http2;
#     (newer nginx: a separate line  `http2 on;`)

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain;

    # replace CloudPanel's existing `location / { … proxy_pass … }` with:
    location / {
        proxy_pass http://apms_live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # live stream: never buffered, long-lived
    location = /api/company-live {
        proxy_pass http://apms_live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

# Not included on purpose: the optional `location /assets/ { root … }` from
# NGINX-AND-SERVER.md. The app folder is now a symlink into ~/apms-deploy,
# which nginx may not be allowed to read; Node already sends those files with
# a 1-year immutable cache header, so the gain is small.
