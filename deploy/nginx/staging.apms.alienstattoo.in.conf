# STAGING — staging.apms.alienstattoo.in -> PM2 apms-staging on 127.0.0.1:3013
#
# CloudPanel: Add Site -> "Create a Reverse Proxy", domain
# staging.apms.alienstattoo.in, reverse proxy URL http://127.0.0.1:3013,
# then SSL/TLS -> New Let's Encrypt certificate. Then Vhost: same edits as
# live (see apms.alienstattoo.in.conf), with THIS upstream name and port.

# (1) top of the vhost, outside server { }
upstream apms_stage {
    server 127.0.0.1:3013;
    keepalive 16;
    keepalive_timeout 4s;
}

# (2) inside the 443 server { } block
    # keep staging out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain;

    location / {
        proxy_pass http://apms_stage;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/company-live {
        proxy_pass http://apms_stage;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }
